spring.application.name=SistemaBiblioteca_api


spring.datasource.url=jdbc:mysql://localhost:3306/db_biblioteca
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# para decidir qunatas objetos vai pode acessar em cada pagina
spring.data.web.pageable.max-page-size=10
